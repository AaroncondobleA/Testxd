<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Corazones</title>
    <style>
        /* Estilos generales */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Pantalla de inicio para permitir el audio en celulares */
        #pantalla-inicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease;
        }

        #btn-entrar {
            padding: 15px 35px;
            font-size: 18px;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
            font-weight: bold;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }

        #btn-entrar:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <button id="btn-entrar">Entrar a la Galaxia</button>
    </div>

    <audio id="musica-fondo" loop>
        <source src="music.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- LÓGICA DEL AUDIO Y PANTALLA DE INICIO ---
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const botonEntrar = document.getElementById('btn-entrar');
        const musica = document.getElementById('musica-fondo');

        botonEntrar.addEventListener('click', () => {
            // Intentar reproducir la música (ahora el celular lo permite porque el usuario hizo "click")
            musica.play().catch(error => console.log("Error al reproducir audio:", error));
            
            // Desvanecer la pantalla de inicio
            pantallaInicio.style.opacity = '0';
            setTimeout(() => {
                pantallaInicio.style.display = 'none';
            }, 1000);
        });


        // --- LÓGICA DE LA GALAXIA 3D ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.minDistance = 20;
        controls.maxDistance = 120;

        const galaxy = new THREE.Group();
        scene.add(galaxy);

        const textureLoader = new THREE.TextureLoader();
        
        // RECUERDA: Cambia estos nombres por tus archivos reales de imagen
        const photoTexture = textureLoader.load('IMG-20260522-WA0041.jpg'); 
        const heartTexture = textureLoader.load('corazon.png');   

        function createParticle(texture, size) {
            const material = new THREE.SpriteMaterial({ map: texture, color: 0xffffff });
            const sprite = new THREE.Sprite(material);
            
            // Distribución esférica aleatoria
            const r = 50 * Math.random();
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            sprite.position.x = r * Math.sin(phi) * Math.cos(theta);
            sprite.position.y = r * Math.sin(phi) * Math.sin(theta);
            sprite.position.z = r * Math.cos(phi);
            
            sprite.scale.set(size, size, 1);
            return sprite;
        }

        // Añadir elementos a la galaxia
        for (let i = 0; i < 100; i++) galaxy.add(createParticle(heartTexture, 2.5));
        for (let i = 0; i < 50; i++)  galaxy.add(createParticle(photoTexture, 4.5));

        camera.position.z = 75;

        // Animación continua
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotación automática suave de la galaxia
            galaxy.rotation.y += 0.0012; 
            galaxy.rotation.x += 0.0004; 

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Ajuste por si el usuario voltea el celular
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>
</html>
